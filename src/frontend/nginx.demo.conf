# Only the dedicated edge gateway represents the host Nginx, which replaces
# client-supplied forwarding headers. Other peers cannot claim an identity.
map "$realip_remote_addr:$http_x_forwarded_proto" $demo_forwarded_scheme {
  default $scheme;
  "172.31.10.1:https" https;
  "172.31.10.1:http" http;
}

server {
  listen 80;
  server_name localhost;
  client_max_body_size 11m;
  set_real_ip_from 172.31.10.1;
  real_ip_header X-Forwarded-For;

  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    access_log off;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location ~* ^/api/auth/reset-password/?$ {
    access_log off;
    error_log /dev/null emerg;
    set $args "";
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $demo_forwarded_scheme;
  }

  location ~* ^/api/auth/reset-password/ {
    access_log off;
    error_log /dev/null emerg;
    log_not_found off;
    return 404;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $demo_forwarded_scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $demo_forwarded_scheme;
  }

  location ~* ^/invitacion(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    log_not_found off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
